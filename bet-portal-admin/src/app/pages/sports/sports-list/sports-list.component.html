<div class="sports-list-page">
  <div class="page-header">
    <h2 class="m-0">Sports</h2>
    <button type="button" class="btn btn-primary" (click)="onNewSportClick()">
      New Sport
    </button>
  </div>

  @if (error) {
    <div class="alert alert-danger mt-3 mb-0">{{ error }}</div>
  }

  @if (isBrowser) {
    <ag-grid-angular
      class="ag-theme-quartz sports-grid mt-3"
      style="width: 100%; height: 560px;"
      [modules]="modules"
      [rowData]="sports"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [pagination]="true"
      [paginationPageSize]="25"
      [animateRows]="true"
      [loading]="loading">
    </ag-grid-angular>
  } @else {
    <div class="mt-3 text-muted">Loading sports page...</div>
  }
</div>

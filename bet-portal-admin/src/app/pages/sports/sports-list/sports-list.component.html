<div class="sports-list-page">
  <div class="page-header">
    <h2 class="m-0">Sports</h2>
    <button type="button" class="btn btn-primary" (click)="onNewSportClick()">
      New Sport
    </button>
  </div>

  @if (error) {
    <div class="alert alert-danger mt-3 mb-0">{{ error }}</div>
  }

  @if (isBrowser) {
    <div class="card shadow-sm mt-3 sports-grid-card">
      <div class="card-body p-0">
        <ag-grid-angular
          class="ag-theme-alpine sports-grid"
          style="width: 100%; min-height: 280px;"
          [modules]="modules"
          [rowData]="sports"
          [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef"
          domLayout="autoHeight"
          [pagination]="true"
          [paginationPageSize]="25"
          [animateRows]="true"
          [loading]="loading">
        </ag-grid-angular>
      </div>
    </div>
  } @else {
    <div class="mt-3 text-muted">Loading sports page...</div>
  }
</div>

<mat-toolbar color="primary" class="nav-toolbar">
  <a class="brand-link" routerLink="/">My Angular App</a>

  <span class="spacer"></span>

  @if (!isMobile) {
    <div class="desktop-actions">
      <a mat-button routerLink="/">Home</a>

      <button mat-button [matMenuTriggerFor]="adminMenu">
        <span>Administration</span>
        <span class="desktop-arrow" aria-hidden="true">&#9662;</span>
      </button>

      <a mat-button routerLink="/about">About</a>
      <a mat-button routerLink="/contact">Contact</a>
      <button mat-button type="button" (click)="logOut()">Logout</button>
    </div>
  } @else {
    <button mat-icon-button [matMenuTriggerFor]="mobileMenu" aria-label="Open navigation menu">
      <span class="menu-glyph" aria-hidden="true">&#9776;</span>
    </button>
  }
</mat-toolbar>

<mat-menu #adminMenu="matMenu">
  <button mat-menu-item routerLink="/sports-list">Sports</button>
  <button mat-menu-item routerLink="/countries-list">Countries</button>
</mat-menu>

<mat-menu #mobileMenu="matMenu">
  <button mat-menu-item routerLink="/">Home</button>
  <button mat-menu-item [matMenuTriggerFor]="mobileAdminMenu">Administration</button>
  <button mat-menu-item routerLink="/about">About</button>
  <button mat-menu-item routerLink="/contact">Contact</button>
  <button mat-menu-item type="button" (click)="logOut()">Logout</button>
</mat-menu>

<mat-menu #mobileAdminMenu="matMenu">
  <button mat-menu-item routerLink="/sports-list">Sports</button>
  <button mat-menu-item routerLink="/countries-list">Countries</button>
</mat-menu>

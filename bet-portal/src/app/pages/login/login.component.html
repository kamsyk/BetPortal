@if (googleAccountRequired()) {
  <p role="alert">{{ 'login.googleAccountRequired' | translate }}</p>
}
@if (googleAccountExists()) {
  <p role="alert">{{ 'login.googleAccountExists' | translate }}</p>
}
<lib-ks-login
  class="login-component"
  [language]="currentLanguage()"
  [loginUrl]="loginUrl()"
  [redirectUrl]="redirectUrl()"
  [googleAuthUrl]="googleAuthUrl()"
  [googleReturnUrl]="googleReturnUrl()"
  (loginSuccess)="onLoginSuccess($event)"
></lib-ks-login>

<div class="sign-up-page">
  <div class="login-dialog-toolbar">
    <button
      type="button"
      class="login-dialog-close"
      (click)="closeDialog()"
      [attr.aria-label]="'login.close' | translate"
    >
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  @if (googleAccountRequired()) {
    <p role="alert">{{ 'login.googleAccountRequired' | translate }}</p>
  }
  @if (facebookAccountRequired()) {
    <p role="alert">{{ 'login.facebookAccountRequired' | translate }}</p>
  }

  <lib-ks-sign-up
    class="sign-up-component"
    [language]="currentLanguage()"
    [providers]="providers"
    [googleAuthUrl]="googleAuthUrl()"
    [googleReturnUrl]="googleReturnUrl()"
    [facebookAuthUrl]="facebookAuthUrl()"
    [facebookReturnUrl]="facebookReturnUrl()"
  ></lib-ks-sign-up>

  <p class="sign-in-prompt">
    <button type="button" (click)="openLogin()">{{ 'nav.signIn' | translate }}</button>
  </p>
</div>
